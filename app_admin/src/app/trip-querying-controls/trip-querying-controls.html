<div class="col-md-4"> 
    <h2 class="text-center">Query Controls</h2> 
    <form 
    *ngIf="queryForm" 
    [formGroup]="queryForm"
    (ngSubmit)="onSubmit()"> 
 
        <div class="form-group"> 
            <label>Start Of Searched Dates:</label> 
            <input 
            type="date" 
            formControlName="beginAcceptableDate"  
            placeholder="First Date " 
            class="form-control" 
            > 
        </div>

        <div class="form-group"> 
            <label>End Of Searched Dates:</label> 
            <input 
            type="date" 
            formControlName="endAcceptableDate"  
            placeholder="endAcceptableDate" 
            class="form-control" 
            > 
        </div>
